<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login — krishhhh.verse</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --red:#ff1f1f;
    --black:#050505;
    --dark:#0b0b0b;
    --border:#242424;
    --muted:#777;
}

body{

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    background:var(--black);

    color:#fff;

    font-family:'Inter',sans-serif;

    padding:20px;

    overflow:hidden;

}


/* =========================
   BACKGROUND EFFECT
========================= */

body::before{

    content:"";

    position:fixed;

    width:550px;
    height:550px;

    top:-280px;
    right:-220px;

    background:rgba(255,31,31,.13);

    filter:blur(110px);

    border-radius:50%;

    pointer-events:none;

}

body::after{

    content:"";

    position:fixed;

    width:350px;
    height:350px;

    bottom:-200px;
    left:-150px;

    background:rgba(255,31,31,.07);

    filter:blur(100px);

    border-radius:50%;

    pointer-events:none;

}


/* =========================
   LOGIN BOX
========================= */

.login-box{

    position:relative;

    width:100%;
    max-width:430px;

    background:#0b0b0b;

    border:1px solid #242424;

    padding:42px;

    box-shadow:
        0 30px 100px rgba(0,0,0,.65);

    z-index:2;

}


/* =========================
   LOGO
========================= */

.logo{

    font-family:'Syne',sans-serif;

    font-size:1.8rem;

    font-weight:800;

    letter-spacing:-.05em;

    margin-bottom:8px;

}

.logo span{
    color:var(--red);
}


/* =========================
   SUBTITLE
========================= */

.subtitle{

    color:#777;

    font-size:.78rem;

    margin-bottom:35px;

}


/* =========================
   ADMIN BADGE
========================= */

.admin-badge{

    display:inline-flex;

    align-items:center;

    gap:7px;

    padding:7px 10px;

    margin-bottom:25px;

    background:#111;

    border:1px solid #292929;

    color:#888;

    font-size:.58rem;

    font-weight:600;

    text-transform:uppercase;

    letter-spacing:.1em;

}

.admin-dot{

    width:6px;
    height:6px;

    border-radius:50%;

    background:#48d86a;

    box-shadow:
        0 0 8px rgba(72,216,106,.5);

}


/* =========================
   INPUT
========================= */

.input-group{

    margin-bottom:18px;

}

.label{

    display:block;

    color:#777;

    font-size:.63rem;

    font-weight:600;

    text-transform:uppercase;

    letter-spacing:.12em;

    margin-bottom:8px;

}

input{

    width:100%;

    padding:15px;

    background:#111;

    color:#fff;

    border:1px solid #292929;

    outline:none;

    font-family:'Inter',sans-serif;

    font-size:.84rem;

    transition:.2s;

}

input::placeholder{
    color:#444;
}

input:focus{

    border-color:var(--red);

    box-shadow:
        0 0 0 2px rgba(255,31,31,.08);

}


/* =========================
   PASSWORD WRAPPER
========================= */

.password-wrapper{

    position:relative;

}

.password-wrapper input{

    padding-right:55px;

}

.show-password{

    position:absolute;

    right:0;
    top:0;

    height:100%;

    width:50px;

    border:0;

    background:transparent;

    color:#555;

    cursor:pointer;

    font-size:.85rem;

}

.show-password:hover{
    color:#fff;
}


/* =========================
   LOGIN BUTTON
========================= */

.login-btn{

    width:100%;

    padding:16px;

    border:0;

    background:var(--red);

    color:#fff;

    cursor:pointer;

    font-family:'Syne',sans-serif;

    font-size:.72rem;

    font-weight:700;

    text-transform:uppercase;

    letter-spacing:.1em;

    transition:.25s;

    margin-top:5px;

}

.login-btn:hover{

    background:#fff;

    color:#000;

}

.login-btn:disabled{

    opacity:.5;

    cursor:not-allowed;

}


/* =========================
   LOADING
========================= */

.login-btn.loading{

    position:relative;

}

.login-btn.loading::after{

    content:"";

    display:inline-block;

    width:10px;
    height:10px;

    margin-left:8px;

    border:2px solid rgba(255,255,255,.35);

    border-top-color:#fff;

    border-radius:50%;

    animation:spin .7s linear infinite;

}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================
   ERROR
========================= */

.error{

    display:none;

    margin-top:18px;

    padding:13px;

    background:#1b0b0b;

    border:1px solid #542323;

    color:#ff7373;

    font-size:.72rem;

    line-height:1.5;

}

.error.show{
    display:block;
}


/* =========================
   SUCCESS
========================= */

.success{

    display:none;

    margin-top:18px;

    padding:13px;

    background:#0b180e;

    border:1px solid #214b28;

    color:#68db79;

    font-size:.72rem;

}

.success.show{
    display:block;
}


/* =========================
   BACK
========================= */

.back{

    display:block;

    margin-top:25px;

    text-align:center;

    color:#555;

    font-size:.68rem;

    text-decoration:none;

    transition:.2s;

}

.back:hover{
    color:#fff;
}


/* =========================
   FOOTER
========================= */

.footer{

    margin-top:30px;

    padding-top:18px;

    border-top:1px solid #1c1c1c;

    text-align:center;

    color:#3f3f3f;

    font-size:.58rem;

    text-transform:uppercase;

    letter-spacing:.08em;

}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    body{
        padding:15px;
    }

    .login-box{

        padding:30px 22px;

    }

    .logo{

        font-size:1.6rem;

    }

}

</style>

</head>


<body>


<!-- =========================
     LOGIN BOX
========================= -->

<div class="login-box">


    <!-- LOGO -->

    <div class="logo">

        krishhhh<span>.verse</span>

    </div>


    <div class="subtitle">

        Admin Dashboard

    </div>


    <!-- STATUS -->

    <div class="admin-badge">

        <span class="admin-dot"></span>

        Secure Admin Access

    </div>


    <!-- LOGIN FORM -->

    <form id="loginForm">


        <!-- EMAIL -->

        <div class="input-group">

            <label
                class="label"
                for="email"
            >

                Email

            </label>


            <input
                type="email"
                id="email"
                placeholder="admin@email.com"
                autocomplete="email"
                required
            >

        </div>


        <!-- PASSWORD -->

        <div class="input-group">

            <label
                class="label"
                for="password"
            >

                Password

            </label>


            <div class="password-wrapper">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >


                <button
                    type="button"
                    class="show-password"
                    id="showPassword"
                    aria-label="Show password"
                >

                    👁

                </button>

            </div>

        </div>


        <!-- LOGIN -->

        <button
            type="submit"
            class="login-btn"
            id="loginBtn"
        >

            Login to Dashboard

        </button>


        <!-- ERROR -->

        <div
            class="error"
            id="errorBox"
        ></div>


        <!-- SUCCESS -->

        <div
            class="success"
            id="successBox"
        >

            ✅ Login successful. Opening dashboard...

        </div>


    </form>


    <!-- BACK -->

    <a
        href="index.html"
        class="back"
    >

        ← Back to website

    </a>


    <div class="footer">

        krishhhh.verse · Admin Panel

    </div>


</div>


<script>


/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
    "https://idnaxcwiskgzyodrlhzi.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_I4tdxFDZe6P8Wq215eRlLg_J3c85jAC";


/* =========================================================
   ELEMENTS
========================================================= */

const loginForm =
    document.getElementById(
        "loginForm"
    );


const loginBtn =
    document.getElementById(
        "loginBtn"
    );


const errorBox =
    document.getElementById(
        "errorBox"
    );


const successBox =
    document.getElementById(
        "successBox"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const showPassword =
    document.getElementById(
        "showPassword"
    );


/* =========================================================
   CHECK EXISTING SESSION
========================================================= */

const existingSession =
    localStorage.getItem(
        "krish_admin_session"
    );


if(existingSession){

    try{

        const session =
            JSON.parse(
                existingSession
            );


        /*
           Check whether access token
           actually exists.
        */

        if(
            session &&
            session.access_token
        ){

            window.location.href =
                "admin.html";

        }

    }
    catch(error){

        localStorage.removeItem(
            "krish_admin_session"
        );

    }

}


/* =========================================================
   SHOW / HIDE PASSWORD
========================================================= */

showPassword.addEventListener(
    "click",
    function(){

        if(
            passwordInput.type ===
            "password"
        ){

            passwordInput.type =
                "text";

            showPassword.textContent =
                "🙈";

        }
        else{

            passwordInput.type =
                "password";

            showPassword.textContent =
                "👁";

        }

    }
);


/* =========================================================
   HIDE MESSAGES
========================================================= */

function hideMessages(){

    errorBox.classList.remove(
        "show"
    );

    successBox.classList.remove(
        "show"
    );

    errorBox.textContent =
        "";

}


/* =========================================================
   SHOW ERROR
========================================================= */

function showError(message){

    errorBox.textContent =
        "❌ " + message;

    errorBox.classList.add(
        "show"
    );

}


/* =========================================================
   LOGIN
========================================================= */

loginForm.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        hideMessages();


        if(!email){

            showError(
                "Please enter your email."
            );

            emailInput.focus();

            return;

        }


        if(!password){

            showError(
                "Please enter your password."
            );

            passwordInput.focus();

            return;

        }


        loginBtn.disabled =
            true;


        loginBtn.classList.add(
            "loading"
        );


        loginBtn.textContent =
            "Logging in...";


        try{


            /* =================================================
               SUPABASE AUTH
            ================================================= */

            const response =
                await fetch(

                    SUPABASE_URL +
                    "/auth/v1/token?grant_type=password",

                    {

                        method:"POST",

                        headers:{

                            "apikey":
                                SUPABASE_KEY,

                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                email:
                                    email,

                                password:
                                    password

                            })

                    }

                );


            let data;


            try{

                data =
                    await response.json();

            }
            catch{

                data = {};

            }


            /* =================================================
               LOGIN ERROR
            ================================================= */

            if(!response.ok){

                let errorMessage =
                    "Invalid email or password.";


                if(
                    data.error_description
                ){

                    errorMessage =
                        data.error_description;

                }
                else if(
                    data.msg
                ){

                    errorMessage =
                        data.msg;

                }
                else if(
                    data.message
                ){

                    errorMessage =
                        data.message;

                }


                throw new Error(
                    errorMessage
                );

            }


            /* =================================================
               VALIDATE SESSION
            ================================================= */

            if(
                !data.access_token
            ){

                throw new Error(
                    "Login succeeded but no access token was received."
                );

            }


            /* =================================================
               SAVE SESSION
            ================================================= */

            localStorage.setItem(

                "krish_admin_session",

                JSON.stringify(data)

            );


            /* =================================================
               SUCCESS
            ================================================= */

            successBox.classList.add(
                "show"
            );


            loginBtn.textContent =
                "Success ✓";


            loginBtn.classList.remove(
                "loading"
            );


            /* =================================================
               REDIRECT
            ================================================= */

            setTimeout(
                function(){

                    window.location.href =
                        "admin.html";

                },
                700
            );


        }
        catch(error){

            console.error(
                "LOGIN ERROR:",
                error
            );


            showError(
                error.message ||
                "Unable to login. Please try again."
            );


            loginBtn.disabled =
                false;


            loginBtn.classList.remove(
                "loading"
            );


            loginBtn.textContent =
                "Login to Dashboard";

        }

    }
);


/* =========================================================
   ENTER KEY SUPPORT
========================================================= */

passwordInput.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "Enter"
        ){

            loginForm.requestSubmit();

        }

    }
);


</script>


</body>

</html>
