<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login — krishhhh.verse</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#050505;

    color:#fff;

    font-family:'Inter',sans-serif;

    padding:20px;

}

body::before{

    content:"";

    position:fixed;

    width:500px;
    height:500px;

    top:-250px;
    right:-200px;

    background:rgba(255,0,0,.12);

    filter:blur(100px);

    border-radius:50%;

    pointer-events:none;

}

.login-box{

    width:100%;
    max-width:430px;

    background:#0b0b0b;

    border:1px solid #242424;

    padding:42px;

    box-shadow:
        0 30px 100px rgba(0,0,0,.6);

}

.logo{

    font-family:'Syne',sans-serif;

    font-size:1.8rem;

    font-weight:800;

    letter-spacing:-.05em;

    margin-bottom:8px;

}

.logo span{
    color:#ff1f1f;
}

.subtitle{

    color:#777;

    font-size:.8rem;

    margin-bottom:35px;

}

.label{

    display:block;

    color:#777;

    font-size:.65rem;

    font-weight:600;

    text-transform:uppercase;

    letter-spacing:.12em;

    margin-bottom:8px;

}

.input-group{
    margin-bottom:18px;
}

input{

    width:100%;

    padding:15px;

    background:#111;

    color:#fff;

    border:1px solid #292929;

    outline:none;

    font-size:.85rem;

    transition:.2s;

}

input:focus{

    border-color:#ff1f1f;

    box-shadow:
        0 0 0 2px rgba(255,31,31,.08);

}

.login-btn{

    width:100%;

    padding:16px;

    border:0;

    background:#ff1f1f;

    color:#fff;

    cursor:pointer;

    font-family:'Syne',sans-serif;

    font-size:.75rem;

    font-weight:700;

    text-transform:uppercase;

    letter-spacing:.1em;

    transition:.25s;

    margin-top:5px;

}

.login-btn:hover{

    background:#fff;

    color:#000;

}

.login-btn:disabled{

    opacity:.5;

    cursor:not-allowed;

}

.error{

    display:none;

    margin-top:18px;

    padding:13px;

    background:#1b0b0b;

    border:1px solid #542323;

    color:#ff7373;

    font-size:.75rem;

    line-height:1.5;

}

.back{

    display:block;

    margin-top:25px;

    text-align:center;

    color:#555;

    font-size:.7rem;

    text-decoration:none;

}

.back:hover{
    color:#fff;
}

@media(max-width:500px){

    .login-box{
        padding:30px 22px;
    }

}

</style>

</head>

<body>

<div class="login-box">

    <div class="logo">
        krishhhh<span>.verse</span>
    </div>

    <div class="subtitle">
        Admin Dashboard
    </div>


    <form id="loginForm">

        <div class="input-group">

            <label class="label">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="admin@email.com"
                required
            >

        </div>


        <div class="input-group">

            <label class="label">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

        </div>


        <button
            type="submit"
            class="login-btn"
            id="loginBtn"
        >
            Login to Dashboard
        </button>


        <div
            class="error"
            id="errorBox"
        ></div>

    </form>


    <a
        href="index.html"
        class="back"
    >
        ← Back to website
    </a>

</div>


<script>

const SUPABASE_URL =
"https://idnaxcwiskgzyodrlhzi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_I4tdxFDZe6P8Wq215eRlLg_J3c85jAC";


const loginForm =
document.getElementById("loginForm");

const loginBtn =
document.getElementById("loginBtn");

const errorBox =
document.getElementById("errorBox");


/* CHECK EXISTING SESSION */

const existingSession =
localStorage.getItem("krish_admin_session");

if(existingSession){

    window.location.href =
        "admin.html";

}


/* LOGIN */

loginForm.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const email =
            document
            .getElementById("email")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        errorBox.style.display =
            "none";


        loginBtn.disabled =
            true;

        loginBtn.textContent =
            "Logging in...";


        try{

            const response =
                await fetch(

                    SUPABASE_URL +
                    "/auth/v1/token?grant_type=password",

                    {

                        method:"POST",

                        headers:{

                            "apikey":
                                SUPABASE_KEY,

                            "Content-Type":
                                "application/json"

                        },

                        body:JSON.stringify({

                            email:email,

                            password:password

                        })

                    }

                );


            const data =
                await response.json();


            if(!response.ok){

                throw new Error(
                    data.error_description ||
                    data.msg ||
                    "Invalid email or password."
                );

            }


            /* SAVE SESSION */

            localStorage.setItem(
                "krish_admin_session",
                JSON.stringify(data)
            );


            window.location.href =
                "admin.html";

        }
        catch(error){

            console.error(error);

            errorBox.textContent =
                "❌ " + error.message;

            errorBox.style.display =
                "block";

        }
        finally{

            loginBtn.disabled =
                false;

            loginBtn.textContent =
                "Login to Dashboard";

        }

    }
);

</script>

</body>
</html>
