<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — krishhhh.verse</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#f5f3ee;
  --card:#fff;
  --text:#171717;
  --muted:#777;
  --gold:#b08a32;
  --border:#e5e1d8;
  --error:#c0392b;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 20% 20%,rgba(176,138,50,.08),transparent 35%),
    radial-gradient(circle at 80% 80%,rgba(176,138,50,.06),transparent 35%),
    var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
}

.login-box{
  width:420px;
  max-width:92%;
  background:var(--card);
  border:1px solid var(--border);
  padding:48px;
  box-shadow:0 20px 60px rgba(0,0,0,.08);
}

.logo{
  text-align:center;
  font-family:'Syne',sans-serif;
  font-size:1.5rem;
  font-weight:800;
  margin-bottom:8px;
}

.logo span{color:var(--gold)}

.subtitle{
  text-align:center;
  color:var(--muted);
  font-size:.75rem;
  text-transform:uppercase;
  letter-spacing:.15em;
  margin-bottom:35px;
}

.lock{
  text-align:center;
  font-size:2.5rem;
  margin-bottom:20px;
}

label{
  display:block;
  font-size:.72rem;
  text-transform:uppercase;
  letter-spacing:.1em;
  color:var(--muted);
  margin-bottom:7px;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:18px;
  border:1px solid var(--border);
  background:#fafafa;
  color:var(--text);
  outline:none;
  font-size:.9rem;
}

input:focus{border-color:var(--gold)}

button{
  width:100%;
  padding:15px;
  border:none;
  background:var(--gold);
  color:#fff;
  cursor:pointer;
  font-family:'Syne',sans-serif;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
}

button:hover{opacity:.9}

button:disabled{
  opacity:.6;
  cursor:wait;
}

.error{
  display:none;
  padding:12px;
  margin-bottom:16px;
  border:1px solid #e8b4ae;
  background:#fff4f2;
  color:var(--error);
  font-size:.82rem;
  text-align:center;
}

.back{
  display:block;
  text-align:center;
  margin-top:22px;
  color:var(--muted);
  text-decoration:none;
  font-size:.8rem;
}

.back:hover{color:var(--text)}
</style>
</head>

<body>

<div class="login-box">

  <div class="lock">🔐</div>

  <div class="logo">
    krishhhh<span>.verse</span>
  </div>

  <div class="subtitle">
    Admin Access Only
  </div>

  <div class="error" id="errorMsg"></div>

  <form id="loginForm">

    <label for="email">Admin Email</label>

    <input
      type="email"
      id="email"
      placeholder="Enter admin email"
      required
    >

    <label for="password">Password</label>

    <input
      type="password"
      id="password"
      placeholder="Enter password"
      required
    >

    <button type="submit" id="loginBtn">
      Login to Dashboard →
    </button>

  </form>

  <a href="index.html" class="back">
    ← Back to website
  </a>

</div>

<script>

const SUPABASE_URL =
'https://idnaxcwiskgzyodrlhzi.supabase.co';

const SUPABASE_KEY =
'sb_publishable_I4tdxFDZe6P8Wq215eRlLg_J3c85jAC';

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* CHECK LOGIN */

async function checkLogin(){

  const {
    data:{session}
  } =
  await supabaseClient.auth.getSession();

  if(session){
    window.location.href='admin.html';
  }

}

checkLogin();


/* LOGIN */

document
.getElementById('loginForm')
.addEventListener('submit',async function(e){

  e.preventDefault();

  const email =
    document.getElementById('email').value.trim();

  const password =
    document.getElementById('password').value;

  const button =
    document.getElementById('loginBtn');

  const error =
    document.getElementById('errorMsg');

  error.style.display='none';

  button.disabled=true;
  button.textContent='Logging in...';

  try{

    const {
      data,
      error:loginError
    } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    if(loginError){
      throw loginError;
    }

    if(data.session){
      window.location.href='admin.html';
    }

  }catch(err){

    console.error(err);

    error.textContent =
      err.message ||
      'Incorrect email or password.';

    error.style.display='block';

    button.disabled=false;
    button.textContent='Login to Dashboard →';

  }

});

</script>

</body>
</html>
