<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Admin Login — krishhhh.verse</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --red:#ff1744;
    --red2:#ff003c;
    --black:#050505;
    --dark:#0d0d0d;
    --card:#111;
    --border:#242424;
    --text:#fff;
    --muted:#888;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(255,23,68,.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(255,0,60,.12),
            transparent 35%
        ),
        var(--black);

    color:var(--text);
    font-family:Inter,sans-serif;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
    overflow:hidden;
}


/* ================= BACKGROUND ================= */

.bg-line{
    position:fixed;
    width:500px;
    height:500px;

    border:1px solid rgba(255,23,68,.08);

    border-radius:50%;

    pointer-events:none;
}

.bg-line.one{
    top:-250px;
    left:-200px;
}

.bg-line.two{
    bottom:-300px;
    right:-200px;
}


/* ================= LOGIN BOX ================= */

.login-box{
    width:430px;
    max-width:100%;

    background:rgba(15,15,15,.94);

    border:1px solid var(--border);

    padding:42px;

    box-shadow:
        0 30px 100px rgba(0,0,0,.7),
        0 0 60px rgba(255,23,68,.06);

    position:relative;
    z-index:2;
}

.login-box::before{
    content:"";

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:3px;

    background:linear-gradient(
        90deg,
        transparent,
        var(--red),
        transparent
    );
}


/* ================= LOGO ================= */

.logo{
    text-align:center;
    margin-bottom:8px;
}

.logo img{
    width:180px;
    max-width:100%;
    height:auto;

    display:block;
    margin:0 auto;
}


/* ================= SUBTITLE ================= */

.subtitle{
    text-align:center;

    color:#777;

    font-size:10px;

    text-transform:uppercase;

    letter-spacing:4px;

    margin-bottom:35px;
}


/* ================= LOCK ================= */

.lock{
    width:68px;
    height:68px;

    border-radius:50%;

    background:rgba(255,23,68,.08);

    border:1px solid rgba(255,23,68,.3);

    display:flex;

    align-items:center;
    justify-content:center;

    margin:0 auto 22px;

    font-size:27px;

    box-shadow:
        0 0 35px rgba(255,23,68,.1);
}


/* ================= LABEL ================= */

label{
    display:block;

    color:#888;

    font-size:10px;

    font-weight:700;

    text-transform:uppercase;

    letter-spacing:1.5px;

    margin-bottom:8px;
}


/* ================= INPUT ================= */

.input-wrap{
    position:relative;

    margin-bottom:18px;
}

input{
    width:100%;
    height:50px;

    border:1px solid var(--border);

    background:#090909;

    color:#fff;

    padding:0 15px;

    outline:none;

    font:inherit;

    font-size:14px;

    transition:.2s;
}

input:focus{
    border-color:var(--red);

    box-shadow:
        0 0 0 3px rgba(255,23,68,.08);
}

input::placeholder{
    color:#444;
}


/* ================= BUTTON ================= */

button{
    width:100%;
    height:52px;

    border:0;

    background:var(--red);

    color:white;

    font-weight:800;

    font-size:12px;

    letter-spacing:1px;

    text-transform:uppercase;

    cursor:pointer;

    transition:.2s;

    margin-top:5px;
}

button:hover{
    background:#ff365d;

    transform:translateY(-1px);

    box-shadow:
        0 12px 30px rgba(255,23,68,.2);
}

button:disabled{
    opacity:.6;

    cursor:wait;

    transform:none;
}


/* ================= ERROR ================= */

.error{
    display:none;

    background:rgba(255,23,68,.08);

    border:1px solid rgba(255,23,68,.35);

    color:#ff6b88;

    padding:12px;

    margin-bottom:18px;

    font-size:12px;

    text-align:center;
}


/* ================= BACK ================= */

.back{
    display:block;

    text-align:center;

    margin-top:22px;

    color:#666;

    text-decoration:none;

    font-size:12px;

    transition:.2s;
}

.back:hover{
    color:#fff;
}


/* ================= STATUS ================= */

.status{
    text-align:center;

    color:#444;

    font-size:9px;

    text-transform:uppercase;

    letter-spacing:2px;

    margin-top:30px;
}

.status span{
    display:inline-block;

    width:6px;
    height:6px;

    background:#19d66b;

    border-radius:50%;

    margin-right:6px;

    box-shadow:
        0 0 10px #19d66b;
}


/* ================= MOBILE ================= */

@media(max-width:500px){

    body{
        padding:15px;
    }

    .login-box{
        padding:32px 24px;
    }

    .logo img{
        width:160px;
    }

}

</style>
</head>

<body>


<!-- ================= BACKGROUND ================= -->

<div class="bg-line one"></div>

<div class="bg-line two"></div>


<!-- ================= LOGIN BOX ================= -->

<div class="login-box">


    <!-- LOGO -->

    <div class="logo">

        <img
            src="logo.png"
            alt="krishhhh.verse">

    </div>


    <!-- LOCK -->

    <div class="lock">
        🔐
    </div>


    <!-- SUBTITLE -->

    <div class="subtitle">
        Creator Control Center
    </div>


    <!-- ERROR -->

    <div
        class="error"
        id="errorMsg">
    </div>


    <!-- LOGIN FORM -->

    <form id="loginForm">


        <!-- EMAIL -->

        <label for="email">
            Admin Email
        </label>


        <div class="input-wrap">

            <input
                type="email"
                id="email"
                placeholder="Enter admin email"
                autocomplete="email"
                required>

        </div>


        <!-- PASSWORD -->

        <label for="password">
            Password
        </label>


        <div class="input-wrap">

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required>

        </div>


        <!-- LOGIN BUTTON -->

        <button
            type="submit"
            id="loginBtn">

            Enter Dashboard →

        </button>


    </form>


    <!-- BACK -->

    <a
        href="index.html"
        class="back">

        ← Back to website

    </a>


    <!-- STATUS -->

    <div class="status">

        <span></span>

        Secure Admin Access

    </div>


</div>


<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://idnaxcwiskgzyodrlhzi.supabase.co";


const SUPABASE_KEY =
"sb_publishable_I4tdxFDZe6P8Wq215eRlLg_J3c85jAC";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



/* =====================================================
   CHECK EXISTING SESSION
===================================================== */

async function checkLogin(){

    const {
        data,
        error
    } =
    await supabaseClient
    .auth
    .getSession();


    if(error){

        console.error(error);

        return;

    }


    if(data.session){

        window.location.href =
            "admin.html";

    }

}


checkLogin();



/* =====================================================
   LOGIN
===================================================== */

document
.getElementById("loginForm")
.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const email =
            document
            .getElementById("email")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        const button =
            document
            .getElementById("loginBtn");


        const error =
            document
            .getElementById("errorMsg");


        error.style.display =
            "none";


        button.disabled =
            true;


        button.textContent =
            "Authenticating...";



        /* SUPABASE LOGIN */

        const {
            data,
            error:loginError
        } =
        await supabaseClient
        .auth
        .signInWithPassword({

            email:email,

            password:password

        });



        /* LOGIN ERROR */

        if(loginError){

            console.error(
                loginError
            );


            error.textContent =
                loginError.message ||
                "Incorrect email or password.";


            error.style.display =
                "block";


            button.disabled =
                false;


            button.textContent =
                "Enter Dashboard →";


            return;

        }



        /* LOGIN SUCCESS */

        if(data.session){

            button.textContent =
                "Access Granted ✓";


            setTimeout(()=>{

                window.location.href =
                    "admin.html";

            },300);

        }

    }
);

</script>

</body>
</html>
