<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login — krishhhh.verse</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --red:#b51f2b;
    --red-dark:#8e1822;
    --black:#090909;
    --card:#12110f;
    --card2:#171512;
    --border:#2d2925;
    --text:#f1eee8;
    --muted:#858078;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        radial-gradient(
            circle at 75% 20%,
            rgba(181,31,43,.12),
            transparent 30%
        ),
        #090909;

    color:var(--text);

    font-family:'Manrope',sans-serif;
}

body::before{
    content:"";

    position:fixed;
    inset:0;

    pointer-events:none;

    opacity:.035;

    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

.login-box{
    width:min(430px,100%);

    padding:42px;

    background:rgba(18,17,15,.96);

    border:1px solid var(--border);

    box-shadow:
        0 35px 100px rgba(0,0,0,.6);
}

.logo{
    font-family:'Space Grotesk',sans-serif;

    font-size:1.5rem;
    font-weight:700;

    letter-spacing:-.05em;

    margin-bottom:45px;
}

.logo span{
    color:var(--red);
}

.admin-label{
    color:var(--red);

    font-size:.62rem;
    font-weight:800;

    text-transform:uppercase;
    letter-spacing:.2em;

    margin-bottom:12px;
}

h1{
    font-family:'Space Grotesk',sans-serif;

    font-size:2.8rem;

    line-height:.95;

    letter-spacing:-.06em;

    margin-bottom:12px;
}

.subtitle{
    color:var(--muted);

    font-size:.78rem;

    line-height:1.7;

    margin-bottom:32px;
}

.field{
    margin-bottom:18px;
}

label{
    display:block;

    margin-bottom:8px;

    color:#77736d;

    font-size:.62rem;
    font-weight:800;

    text-transform:uppercase;
    letter-spacing:.12em;
}

input{
    width:100%;

    padding:15px;

    background:#0d0c0b;

    color:#fff;

    border:1px solid var(--border);

    outline:none;

    font-family:inherit;
    font-size:.82rem;
}

input:focus{
    border-color:var(--red);
}

.login-btn{
    width:100%;

    padding:16px;

    border:0;

    background:var(--red);

    color:#fff;

    cursor:pointer;

    font-size:.68rem;
    font-weight:800;

    text-transform:uppercase;
    letter-spacing:.1em;

    transition:.25s;
}

.login-btn:hover{
    background:#fff;
    color:#111;
}

.login-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.error{
    display:none;

    margin-bottom:18px;

    padding:13px;

    border:1px solid #542323;

    background:#1b0b0b;

    color:#ff7474;

    font-size:.72rem;

    line-height:1.5;
}

.back{
    display:block;

    margin-top:25px;

    text-align:center;

    color:#65615b;

    font-size:.65rem;

    text-transform:uppercase;

    letter-spacing:.1em;
}

.back:hover{
    color:#fff;
}

@media(max-width:500px){

    .login-box{
        padding:30px 24px;
    }

    h1{
        font-size:2.35rem;
    }

}

</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        krishhhh<span>.verse</span>
    </div>

    <div class="admin-label">
        Private Area
    </div>

    <h1>
        Admin<br>Login
    </h1>

    <p class="subtitle">
        Sign in to manage your portfolio, upload videos
        and view customer bookings.
    </p>

    <div
        class="error"
        id="loginError"
    ></div>

    <form id="loginForm">

        <div class="field">

            <label>
                Admin Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="admin@email.com"
                autocomplete="email"
                required
            >

        </div>

        <div class="field">

            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >

        </div>

        <button
            class="login-btn"
            id="loginBtn"
            type="submit"
        >
            Login to Dashboard →
        </button>

    </form>

    <a
        href="index.html"
        class="back"
    >
        ← Back to website
    </a>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://idnaxcwiskgzyodrlhzi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_I4tdxFDZe6P8Wq215eRlLg_J3c85jAC";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const loginForm =
    document.getElementById("loginForm");

const loginBtn =
    document.getElementById("loginBtn");

const loginError =
    document.getElementById("loginError");


function showError(message){

    loginError.textContent =
        message;

    loginError.style.display =
        "block";

}


async function checkExistingSession(){

    const {
        data
    } =
    await supabaseClient.auth.getSession();

    if(
        data &&
        data.session
    ){

        window.location.href =
            "admin.html";

    }

}


loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        loginError.style.display =
            "none";

        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;


        loginBtn.disabled =
            true;

        loginBtn.textContent =
            "Signing in...";


        try{

            const {
                data,
                error
            } =
            await supabaseClient.auth.signInWithPassword({

                email:email,

                password:password

            });


            if(error){

                throw error;

            }


            if(
                !data ||
                !data.session
            ){

                throw new Error(
                    "Login session could not be created."
                );

            }


            window.location.href =
                "admin.html";

        }
        catch(error){

            console.error(
                "LOGIN ERROR:",
                error
            );


            showError(
                error.message ||
                "Invalid email or password."
            );


            loginBtn.disabled =
                false;

            loginBtn.textContent =
                "Login to Dashboard →";

        }

    }
);


checkExistingSession();

</script>

</body>
</html>
